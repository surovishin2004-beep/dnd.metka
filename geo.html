<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фиксация локации ДНД</title>
    <style>
        :root {
            --bg: #19191a;
            --card: #2c2c2e;
            --text: #ffffff;
            --text-sec: #a1a1a6;
            --accent: #0077ff;
            --accent-hover: #0063d6;
            --error: #ff453a;
            --success: #30d158;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-sec);
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #48484a;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status.error {
            display: block;
            background-color: rgba(255, 69, 58, 0.15);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .status.success {
            display: block;
            background-color: rgba(48, 209, 88, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .user-info {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-sec);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ ДНД</h1>
        <p class="subtitle">Нажми кнопку, чтобы зафиксировать свое местоположение для отчета.</p>

        <button id="sendBtn" class="btn" onclick="sendGeo()">
            <span>📍 Отправить геопозицию</span>
        </button>

        <div id="statusMsg" class="status"></div>
        
        <div class="user-info" id="userIdDisplay"></div>
    </div>

    <script>
        // ⬇️️⬇️ ВСТАВЬ СЮДА ССЫЛКУ ИЗ CLOUDFLARE ТУННЕЛЯ ⬇️⬇️⬇️
        // Пример: 'https://random-name.trycloudflare.com'
        const API_BASE_URL = 'https://incorrectly-beautified-fieldfare.cloudpub.ru/';
        
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('statusMsg');
        const userIdDisplay = document.getElementById('userIdDisplay');

        // Получаем ID из ссылки
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('user_id');

        if (userId) {
            userIdDisplay.textContent = `ID бойца: ${userId}`;
        } else {
            showStatus('error', '❌ Ошибка: В ссылке не указан user_id');
            btn.disabled = true;
        }

        function showStatus(type, text) {
            status.className = `status ${type}`;
            status.textContent = text;
        }

        async function sendGeo() {
            if (!userId) return;

            // 1. Блокируем кнопку
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Определяем...';
            status.className = 'status'; // скрыть старые ошибки

            try {
                // 2. Запрашиваем координаты у браузера
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000
                    });
                });

                const { latitude, longitude, accuracy } = position.coords;

                btn.innerHTML = '<div class="loader"></div> Отправляем...';

                // 3. Отправляем данные на твой Flask сервер (в туннель)
                const response = await fetch(`${API_BASE_URL}/api/geo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(userId), // важно число
                        lat: latitude,
                        lon: longitude,
                        acc: Math.round(accuracy)
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showStatus('success', '✅ Местоположение успешно зафиксировано!');
                    btn.innerHTML = '✅ Готово';
                } else {
                    // Если бот ответил ошибкой (например, нет активной смены)
                    showStatus('error', `⚠️ Ошибка: ${result.error || 'Неизвестная ошибка'}`);
                    btn.disabled = false;
                    btn.innerHTML = '📍 Попробовать снова';
                }

            } catch (err) {
                console.error(err);
                let msg = '❌ Ошибка: ';
                if (err.message.includes('Failed to fetch')) {
                    msg += 'Сервер недоступен. Проверь туннель.';
                } else if (err.code === 1) {
                    msg += 'Нет доступа к геолокации.';
                } else {
                    msg += err.message;
                }
                showStatus('error', msg);
                btn.disabled = false;
                btn.innerHTML = '📍 Попробовать снова';
            }
        }
    </script>
</body>
</html>
