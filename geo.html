<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Фиксация локации ДНД</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e2a3a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1e2a3a;
        }
        .desc {
            font-size: 15px;
            color: #5a6874;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .btn-geo {
            background: #2c7be5;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            width: 100%;
            font-size: 18px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-geo:active {
            transform: scale(0.97);
            background: #1a68d1;
        }
        .btn-geo:disabled {
            background: #a0b3c9;
            transform: none;
            cursor: not-allowed;
        }
        .status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            background: #f0f4f8;
            color: #2c3e50;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #8a9aa8;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛡️ ДНД</h1>
    <div class="desc">Нажмите кнопку, чтобы передать своё текущее местоположение</div>
    <button id="geoBtn" class="btn-geo">📍 Отправить местоположение</button>
    <div id="status" class="status">Готово к отправке</div>
    <div class="footer">Данные отправляются только с вашего разрешения</div>
</div>

<script>
    // Получаем user_id из URL (?user_id=123456789)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id');
    const BOT_API_URL = 'https://morosely-fleet-weimaraner.cloudpub.ru/';  // ЗАМЕНИТЕ на реальный адрес бота

    const btn = document.getElementById('geoBtn');
    const statusDiv = document.getElementById('status');

    if (!userId) {
        statusDiv.innerHTML = '❌ Ошибка: не передан ID пользователя.';
        statusDiv.classList.add('error');
        btn.disabled = true;
    }

    async function sendLocation(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        statusDiv.innerHTML = '⏳ Отправка координат...';
        statusDiv.classList.remove('success', 'error');

        try {
            const response = await fetch(BOT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: parseInt(userId),
                    lat: lat,
                    lon: lon,
                    acc: accuracy
                })
            });
            const result = await response.json();
            if (result.success) {
                statusDiv.innerHTML = '✅ Координаты приняты! Смена ДНД активна. Страница закроется через 2 секунды.';
                statusDiv.classList.add('success');
                btn.disabled = true;
                setTimeout(() => window.close(), 2000);
            } else {
                statusDiv.innerHTML = '❌ Ошибка: ' + (result.error || 'не удалось сохранить');
                statusDiv.classList.add('error');
                btn.disabled = false;
            }
        } catch (err) {
            statusDiv.innerHTML = '❌ Ошибка соединения с сервером. Проверьте интернет.';
            statusDiv.classList.add('error');
            btn.disabled = false;
        }
    }

    function handleError(error) {
        let msg = '';
        switch(error.code) {
            case error.PERMISSION_DENIED: msg = 'Доступ к геолокации запрещён. Разрешите в настройках.'; break;
            case error.POSITION_UNAVAILABLE: msg = 'Не удалось определить местоположение.'; break;
            case error.TIMEOUT: msg = 'Превышено время ожидания.'; break;
            default: msg = 'Неизвестная ошибка.';
        }
        statusDiv.innerHTML = '❌ ' + msg;
        statusDiv.classList.add('error');
        btn.disabled = false;
    }

    btn.addEventListener('click', () => {
        if (!userId) return;
        if (!navigator.geolocation) {
            statusDiv.innerHTML = '❌ Ваш браузер не поддерживает геолокацию.';
            statusDiv.classList.add('error');
            return;
        }
        btn.disabled = true;
        statusDiv.innerHTML = '📍 Запрашиваем разрешение и координаты...';
        statusDiv.classList.remove('success', 'error');
        navigator.geolocation.getCurrentPosition(sendLocation, handleError, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        });
    });
</script>
</body>
</html>
