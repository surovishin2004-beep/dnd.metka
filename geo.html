<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фиксация локации ДНД</title>
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #19191a;
            --card-bg: #ffffff;
            --text-primary: #000000;
            --text-secondary: #656565;
            --text-tertiary: #939393;
            --accent: #2688eb;
            --accent-hover: #1e76d1;
            --success: #4bb34b;
            --error-bg: #ffe6e6;
            --error-text: #d00000;
            --success-bg: #e6f9e6;
            --success-text: #0a8022;
            --border-radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #141414;
                --card-bg: #222222;
                --text-primary: #ffffff;
                --text-secondary: #a0a0a0;
                --text-tertiary: #6b6b6b;
                --error-bg: #3a1a1a;
                --error-text: #ff6b6b;
                --success-bg: #1a3a1a;
                --success-text: #6bff6b;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 32px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-send {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-send:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(38, 136, 235, 0.3);
        }

        .btn-send:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-icon {
            font-size: 18px;
        }

        .status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status.success {
            display: block;
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .status.error {
            display: block;
            background-color: var(--error-bg);
            color: var(--error-text);
        }

        .status.loading {
            display: block;
            background-color: transparent;
            color: var(--text-secondary);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.4;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .user-id-display {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            .user-id-display {
                border-top-color: rgba(255, 255, 255, 0.06);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <span>ДНД</span>
        </div>
        <p class="subtitle">
            Нажмите кнопку, чтобы передать своё текущее местоположение
        </p>

        <button id="sendBtn" class="btn-send" onclick="sendLocation()">
            <span class="btn-icon">📍</span>
            <span id="btnText">Отправить местоположение</span>
        </button>

        <div id="status" class="status"></div>

        <div class="footer">
            Данные отправляются только с вашего разрешения
        </div>

        <div class="user-id-display" id="userIdDisplay"></div>
    </div>

    <script>
        // ============================================
        // 🔑 ЗАМЕНИТЕ НА ID ВАШЕГО СООБЩЕСТВА (без минуса)
        // Пример: если ссылка vk.com/club123456, то ID = 123456
        // ============================================
        const COMMUNITY_ID = 236847418; 

        // Получаем user_id из URL параметров
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('user_id');
            
            const displayEl = document.getElementById('userIdDisplay');
            if (uid) {
                displayEl.textContent = `Боец ID: ${uid}`;
                return uid;
            } else {
                displayEl.textContent = '⚠️ user_id не указан в URL';
                return null;
            }
        }

        const userId = getUserId();

        // Инициализация VK Bridge
        (async function initBridge() {
            try {
                await window.vkBridge.send('VKWebAppInit');
                console.log('✅ VK Bridge инициализирован');
            } catch (err) {
                console.warn('⚠️ VK Bridge не инициализирован (возможно, открыто вне VK):', err);
            }
        })();

        function setStatus(type, message) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            statusEl.textContent = message;
        }

        function clearStatus() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status';
            statusEl.textContent = '';
        }

        function setButtonState(state) {
            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');

            btn.disabled = state === 'loading';

            switch (state) {
                case 'loading':
                    btnText.innerHTML = '<span class="spinner"></span> Определяем...';
                    break;
                case 'sending':
                    btnText.innerHTML = '<span class="spinner"></span> Отправляем...';
                    break;
                case 'success':
                    btnText.innerHTML = '✅ Отправлено';
                    break;
                case 'error':
                    btnText.innerHTML = '📍 Отправить местоположение';
                    break;
                default:
                    btnText.innerHTML = '📍 Отправить местоположение';
            }
        }

        async function sendLocation() {
            if (!userId) {
                setStatus('error', '❌ Ошибка: user_id не указан в ссылке');
                return;
            }

            setButtonState('loading');
            clearStatus();

            try {
                // 1️⃣ Запрашиваем геолокацию
                setStatus('loading', '📡 Определяем координаты...');

                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    });
                });

                const { latitude, longitude, accuracy } = position.coords;

                // 2️⃣ Отправляем через VK Bridge
                setStatus('loading', '📤 Отправляем в бота...');
                setButtonState('sending');

                await window.vkBridge.send('VKWebAppCallAPIMethod', {
                    method: 'messages.send',
                    params: {
                        peer_id: COMMUNITY_ID,
                        lat: latitude.toString(),
                        lon: longitude.toString(),
                        random_id: Math.floor(Math.random() * 1000000000),
                        message: `📍 Геопозиция от бойца ${userId}`
                    }
                });

                // 3️⃣ Успех
                setStatus('success', '✅ Местоположение зафиксировано!');
                setButtonState('success');

                // Закрываем Mini App через 1.5 секунды
                setTimeout(async () => {
                    try {
                        await window.vkBridge.send('VKWebAppClose');
                    } catch (e) {
                        console.log('Не удалось закрыть окно');
                    }
                }, 1500);

            } catch (error) {
                console.error('Geo Error:', error);
                
                let errorMsg = '❌ ';
                
                if (error.code === 1) {
                    errorMsg += 'Доступ к геолокации запрещён. Разрешите в настройках браузера/VK.';
                } else if (error.code === 2) {
                    errorMsg += 'Геолокация недоступна на этом устройстве.';
                } else if (error.code === 3) {
                    errorMsg += 'Истекло время ожидания. Проверьте интернет.';
                } else if (error.message && error.message.includes('VKWebAppCallAPIMethod')) {
                    errorMsg += 'Ошибка отправки. Проверьте подключение к интернету.';
                } else {
                    errorMsg += error.message || 'Неизвестная ошибка.';
                }

                setStatus('error', errorMsg);
                setButtonState('error');
            }
        }

        // Поддержка тёмной темы через VK Bridge
        (async function applyTheme() {
            try {
                const theme = await window.vkBridge.send('VKWebAppGetLaunchParams');
                if (theme && theme.scheme) {
                    document.body.classList.toggle('dark-theme', theme.scheme === 'client_dark');
                }
            } catch (e) {
                console.log('Не удалось определить тему');
            }
        })();
    </script>
</body>
</html>
